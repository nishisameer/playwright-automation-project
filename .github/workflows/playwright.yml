name: Playwright Tests

# =============================================================================
# CI/CD pipeline
#   Stage 1   Static checks    type check, lint and formatting, in seconds
#   Stage 2a  Vitest           component tests + AI evaluation (no browser)
#   Stage 2b  Playwright       chromium / firefox / api / examples, in parallel
#   Stage 3   Merge reports    one HTML report + JUnit summary on the run page
#   Stage 4   Publish          report website on GitHub Pages (main only)
# =============================================================================

# --- When the pipeline runs ---
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab
    inputs:
      suite:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options: [all, smoke, security, ui, api]

# --- Least privilege: jobs can only read the repo unless they ask for more ---
permissions:
  contents: read

# --- A new push cancels the older run on the same branch ---
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Stage 1: static checks (fast feedback) ----------
  lint:
    name: Type check, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # one Node version, set in .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck # TypeScript errors
      - run: npm run lint # bugs like a missing await
      - run: npm run format:check # consistent formatting (fix locally with npm run format)

  # ---------- Stage 2a: component tests (Vitest, fast, no browser) ----------
  unit:
    name: Component tests (Vitest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # one Node version, set in .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

      - name: Upload Vitest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/vitest-junit.xml
          retention-days: 7

  # ---------- Stage 2b: run the Playwright tests ----------
  test:
    name: Tests (${{ matrix.project }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # let every project finish, even if one fails
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: api, browser: '' } # API tests need no browser
          - { project: examples, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # one Node version, set in .nvmrc
          cache: npm
      - run: npm ci

      # --- Browsers: reuse the download from earlier runs when the Playwright version is the same ---
      - name: Get Playwright version
        if: matrix.browser != ''
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browser
        if: matrix.browser != ''
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install browser (cache miss)
        if: matrix.browser != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install system libraries only (cache hit)
        if: matrix.browser != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          CI: true
          # Optional: set these in Settings > Secrets. If they're missing, config/env.ts uses the demo values.
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          SUITE: ${{ github.event.inputs.suite || 'all' }}
        # Pick the tests for the chosen suite, and skip projects that aren't part of it.
        run: |
          GREP=""
          if [ "$SUITE" = "smoke" ]; then GREP="--grep @smoke"; fi
          if [ "$SUITE" = "security" ]; then GREP="--grep @security"; fi
          if [ "${{ matrix.project }}" = "examples" ] && [ -n "$GREP" ]; then echo "Examples have no tagged tests"; exit 0; fi
          if [ "$SUITE" = "ui" ]  && [ "${{ matrix.project }}" = "api" ]; then echo "Skipping API for ui suite"; exit 0; fi
          if [ "$SUITE" = "api" ] && [ "${{ matrix.project }}" != "api" ]; then echo "Skipping UI for api suite"; exit 0; fi
          npx playwright test --project=${{ matrix.project }} $GREP --reporter=blob,list

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

      - name: Upload screenshots, videos & traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results
          retention-days: 7

  # ---------- Stage 3: merge results into one HTML report ----------
  report:
    name: Merge reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # one Node version, set in .nvmrc
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=junit.xml npx playwright merge-reports --reporter=junit ./all-blob-reports

      - name: Test summary on the run page
        if: always()
        run: |
          node -e '
            const x = require("fs").readFileSync("junit.xml","utf8");
            const head = (x.match(/<testsuites[^>]*>/) || [""])[0];
            const n = (k) => Number((head.match(new RegExp(k + "=\"(\\d+)\"")) || [0,0])[1]);
            const t = n("tests"), f = n("failures") + n("errors"), s = n("skipped");
            const line = `| ${t} | ${t-f-s} | ${f} | ${s} |`;
            console.log(`## Test results\n\n| Total | Passed | Failed | Skipped |\n|---|---|---|---|\n${line}`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  # ---------- Stage 4: deploy the report as a website ----------
  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
